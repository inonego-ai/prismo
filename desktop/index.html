<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; font-src 'none'"/>
  <title>Prismo</title>
  <link rel="stylesheet" href="./style.css"/>
  <script type="module" src="./renderer.mjs"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="mark" src="./mark.svg" alt="" width="29" height="29"/>
      <span>Prismo</span>
    </div>
    <div class="topbar-controls">
      <div class="server-status" role="status">
        <span class="status-dot" id="server-dot"></span>
        <span id="server-label">확인 중</span>
        <button id="power-button" class="icon-button" type="button" aria-label="서버 시작 또는 중지" title="서버 시작 또는 중지">
          <img src="./icons/power.svg" alt=""/>
        </button>
      </div>
      <div class="topbar-utilities">
        <button id="pc-update-button" class="icon-button" type="button" aria-label="PC 업데이트 확인" title="PC 업데이트 확인">
          <img src="./icons/refresh-cw.svg" alt=""/>
        </button>
        <button id="settings-button" class="settings-button" type="button" title="설정">
          <img src="./icons/settings.svg" alt=""/> 설정
        </button>
      </div>
    </div>
  </header>
  <main class="workspace">
    <section class="surface pair-panel" aria-labelledby="pair-heading">
      <div class="section-head">
        <div class="head-title">
          <img class="section-icon" src="./icons/smartphone.svg" alt=""/>
          <h1 id="pair-heading">연결된 기기</h1>
          <span class="count" id="devices-count">0</span>
        </div>
        <span class="status-chip" id="connection-status">확인 중</span>
      </div>
      <div class="device-list" id="device-list">
        <div class="repo-empty">등록된 기기 없음</div>
      </div>
      <div class="pair-footer">
        <button id="pair-button" class="btn primary" type="button" disabled>
          <img src="./icons/qr-code.svg" alt=""/>
          <span id="pair-label">새 기기 등록</span>
        </button>
        <button id="refresh-button" class="icon-button" type="button" aria-label="새로고침" title="새로고침">
          <img src="./icons/refresh-cw.svg" alt=""/>
        </button>
      </div>
    </section>
    <section class="surface repo-panel" aria-labelledby="repo-heading">
      <div class="section-head">
        <div class="head-title">
          <img class="section-icon" src="./icons/folder-git-2.svg" alt=""/>
          <h2 id="repo-heading">저장소</h2>
          <span class="count" id="repo-count">0</span>
        </div>

      </div>
      <div class="repo-list" id="repository-list">
        <div class="repo-empty">등록된 저장소 없음</div>
      </div>
      <div class="repo-footer">
        <button id="add-button" class="btn outline" type="button">
          <img src="./icons/plus.svg" alt=""/> 저장소 추가
        </button>
      </div>
    </section>
  </main>
  <dialog id="pair-active" class="qr-dialog" aria-label="새 기기 등록">
    <div class="qr-dialog-header">새 기기 등록</div>
    <div class="qr-border"><img id="qr-image" alt="일회용 연결 QR 코드"/></div>
    <input id="pair-link" class="pair-link" type="text" readonly aria-label="연결 주소"/>
    <div class="qr-meta">
      <span><img class="small-icon" src="./icons/clock-3.svg" alt=""/> <span id="countdown">02:00</span></span>
      <span class="qr-actions">
        <button type="button" class="subtle" id="copy-pair-link-button">링크 복사</button>
        <button type="button" class="subtle" id="cancel-pair-button">취소</button>
      </span>
    </div>
  </dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-heading">
    <div class="settings-header">
      <h2 id="settings-heading">설정</h2>
      <button id="close-settings-button" class="subtle" type="button">닫기</button>
    </div>
    <label class="settings-option" for="login-startup-toggle">
      <span>
        <strong>Windows 로그인 시 자동 실행</strong>
        <small id="login-startup-hint">로그인하면 Prismo를 트레이에서 시작합니다.</small>
      </span>
      <input id="login-startup-toggle" type="checkbox" role="switch" disabled/>
    </label>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
